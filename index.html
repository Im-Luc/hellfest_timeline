<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a0b">
<title>Hellfest 2026 — Ma timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a0b; --surface:#171315; --surface2:#211b1e; --line:#2c2529;
  --text:#efe9e4; --muted:#9b918b; --ember:#ff5a1f; --ember2:#ff8a3d; --warn:#ff453a;
  --ms1:#e23b2e; --ms2:#f0892a; --wz:#d8c13a; --vl:#3fae6e; --tp:#5b8def; --al:#a86bd1;
  --disp:'Oswald',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
body{max-width:560px;margin:0 auto;padding-bottom:40px}
.app{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0c0a0b 78%,rgba(12,10,11,.0));backdrop-filter:blur(6px);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--ember2);font-weight:600}
.days{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:9px 15px;border-radius:999px;cursor:pointer;position:relative}
.day.on{background:linear-gradient(180deg,var(--ember),#d8430f);border-color:transparent;color:#fff}
.day.today::after{content:"";position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--ember2)}
.day.on.today::after{background:#fff}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:8px;gap:4px}
.seg button{flex:1;font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted);background:none;border:none;padding:10px 8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface2);color:var(--text)}
.view{padding:14px}

/* now/next */
.live{border:1px solid rgba(255,90,31,.45);background:linear-gradient(180deg,rgba(255,90,31,.14),rgba(255,90,31,.04));border-radius:14px;padding:13px 14px;margin-bottom:14px}
.live .row{display:flex;align-items:baseline;gap:8px}
.live .tag{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600;color:var(--ember2)}
.live .band{font-weight:700;font-size:17px;margin:2px 0 0}
.live .meta{color:var(--muted);font-size:13px;margin-top:1px}
.live .next{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}

/* programme cards */
.card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 12px;margin-bottom:9px;position:relative}
.card .time{flex:none;width:54px;text-align:center;font-variant-numeric:tabular-nums}
.card .time .s{font-weight:700;font-size:15px}
.card .time .e{color:var(--muted);font-size:12px;margin-top:2px}
.card .bar{flex:none;width:4px;border-radius:3px;align-self:stretch}
.card .body{flex:1;min-width:0}
.card .band{font-weight:700;font-size:16px;line-height:1.15}
.card .stage{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:3px}
.card .sdot{width:9px;height:9px;border-radius:3px;flex:none}
.card .confl{margin-top:7px;display:inline-block;background:rgba(255,69,58,.13);border:1px solid rgba(255,69,58,.4);color:#ff8077;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;line-height:1.3}
.card .rm{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:none;background:var(--surface2);color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card.cflag{border-color:rgba(255,69,58,.5)}

.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:15px;line-height:1.5}
.empty button{margin-top:14px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600;background:linear-gradient(180deg,var(--ember),#d8430f);color:#fff;border:none;padding:12px 18px;border-radius:11px;font-size:14px;cursor:pointer}

/* picker (all) */
.search{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px 13px;font-size:15px;font-family:var(--body);margin-bottom:6px}
.search::placeholder{color:#6f6660}
.hint{color:var(--muted);font-size:12px;margin:2px 2px 10px}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.prow.sel{border-color:var(--ember);background:linear-gradient(180deg,rgba(255,90,31,.12),rgba(255,90,31,.03))}
.prow .chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #5a4c52;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.prow.sel .chk{background:var(--ember);border-color:var(--ember);color:#fff}
.prow .pb{flex:1;min-width:0}
.prow .pn{font-weight:600;font-size:15px;line-height:1.2}
.prow .pm{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;align-items:center;gap:6px}
.prow .sdot{width:8px;height:8px;border-radius:3px;flex:none}
.daysep{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted);margin:14px 2px 8px}

.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.foot .cnt{color:var(--muted);font-size:13px}
.pdfbtn{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:11px 15px;border-radius:11px;cursor:pointer}
.tip{color:#6f6660;font-size:11.5px;text-align:center;line-height:1.6;padding:18px 8px 0}

#printout{display:none}
@media print{
  @page{margin:12mm}
  .app,.view .picker,.foot,.tip{display:none!important}
  body,.view{all:unset}
  html,body{background:#fff!important;color:#141414;font-family:var(--body)}
  .view{display:none}
  #printout{display:block;padding:0;font-family:var(--body)}
  .p-title{font-family:var(--disp);text-transform:uppercase;font-size:22px;font-weight:700}
  .p-sub{color:#666;font-size:11px;margin:2px 0 12px}
  .p-day{font-family:var(--disp);text-transform:uppercase;font-size:14px;font-weight:700;margin:14px 0 5px;color:#c4361a;border-bottom:2px solid #c4361a;padding-bottom:2px}
  .p-warn{color:#c4361a;font-size:11px;margin:3px 0;font-weight:600}
  .p-table{width:100%;border-collapse:collapse;font-size:12px}
  .p-table th{text-align:left;color:#999;font-weight:600;font-size:10px;text-transform:uppercase;border-bottom:1px solid #ccc;padding:4px 6px}
  .p-table td{padding:5px 6px;border-bottom:1px solid #eee}
  .p-table tr{break-inside:avoid}.p-row-c .p-band{color:#c4361a}
  .p-time{font-variant-numeric:tabular-nums;white-space:nowrap;color:#444}.p-band{font-weight:600}
  .p-c{color:#c4361a;width:16px;text-align:center;font-weight:700}
}
</style></head>

9:45", "f": "20:45", "g": "Architects"}, {"j": "Dim 21", "s": "Warzone", "d": "19:45", "f": "20:45", "g": "Agnostic Front"}, {"j": "Dim 21", "s": "Altar", "d": "19:45", "f": "20:45", "g": "Possessed"}, {"j": "Dim 21", "s": "Mainstage 1", "d": "20:50", "f": "21:50", "g": "The Hives"}, {"j": "Dim 21", "s": "Valley", "d": "20:50", "f": "21:50", "g": "Acid Bath"}, {"j": "Dim 21", "s": "Temple", "d": "20:50", "f": "21:50", "g": "Marduk"}, {"j": "Dim 21", "s": "Mainstage 2", "d": "21:55", "f": "23:10", "g": "Bad Omens"}, {"j": "Dim 21", "s": "Warzone", "d": "21:55", "f": "23:10", "g": "The Adicts"}, {"j": "Dim 21", "s": "Altar", "d": "21:55", "f": "23:10", "g": "Napalm Death"}, {"j": "Dim 21", "s": "Mainstage 1", "d": "23:15", "f": "00:30", "g": "The Offspring"}, {"j": "Dim 21", "s": "Valley", "d": "23:15", "f": "00:30", "g": "Down"}, {"j": "Dim 21", "s": "Temple", "d": "23:15", "f": "00:30", "g": "Mayhem"}];
const STAGES=["Mainstage 1","Mainstage 2","Warzone","Valley","Temple","Altar"];
const SHEX={"Mainstage 1":"#e23b2e","Mainstage 2":"#f0892a","Warzone":"#d8c13a","Valley":"#3fae6e","Temple":"#5b8def","Altar":"#a86bd1"};
const DAYS=["Jeu 18","Ven 19","Sam 20","Dim 21"];
const DLAB={"Jeu 18":"Jeudi 18","Ven 19":"Vendredi 19","Sam 20":"Samedi 20","Dim 21":"Dimanche 21"};
const FDATE={"Jeu 18":18,"Ven 19":19,"Sam 20":20,"Dim 21":21};
const fav=new Set(); let curDay="Jeu 18", mode="prog", search="";

const toMin=t=>{const a=t.split(":");let h=+a[0],m=+a[1],v=h*60+m;return h<9?v+1440:v;};
const keyOf=x=>x.j+"|"+x.s+"|"+x.d+"|"+x.g;
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dt(x,w){const a=x[w].split(":");let h=+a[0],m=+a[1];const d=new Date(2026,5,FDATE[x.j],h,m,0);if(h<9)d.setDate(d.getDate()+1);return d;}

async function loadFavs(){
  try{if(window.storage){const r=await window.storage.get("hf_favs");if(r&&r.value){JSON.parse(r.value).forEach(k=>fav.add(k));return;}}}catch(e){}
  try{const v=localStorage.getItem("hf_favs");if(v)JSON.parse(v).forEach(k=>fav.add(k));}catch(e){}
}
async function saveFavs(){
  try{if(window.storage){await window.storage.set("hf_favs",JSON.stringify([...fav]));return;}}catch(e){}
  try{localStorage.setItem("hf_favs",JSON.stringify([...fav]));}catch(e){}
}
function toggle(k){fav.has(k)?fav.delete(k):fav.add(k);saveFavs();render();}

function conflictsForDay(d){
  const favs=DATA.filter(x=>x.j===d&&fav.has(keyOf(x)));
  const map={};
  for(let i=0;i<favs.length;i++)for(let j=i+1;j<favs.length;j++){
    const a=favs[i],b=favs[j];
    if(toMin(a.d)<toMin(b.f)&&toMin(b.d)<toMin(a.f)){
      (map[keyOf(a)]=map[keyOf(a)]||[]).push(b);(map[keyOf(b)]=map[keyOf(b)]||[]).push(a);
    }
  }
  return map;
}
function nowInfo(){
  const now=new Date();
  const favs=DATA.filter(x=>fav.has(keyOf(x))).map(x=>({x,s:dt(x,"d"),e:dt(x,"f")}));
  const live=favs.filter(o=>now>=o.s&&now<o.e).sort((a,b)=>a.s-b.s);
  const up=favs.filter(o=>o.s>now).sort((a,b)=>a.s-b.s);
  return {now,live,next:up[0]};
}

function renderDays(){
  const today=new Date(), isFest=today.getFullYear()===2026&&today.getMonth()===5;
  const el=document.getElementById("days");el.innerHTML="";
  DAYS.forEach(d=>{
    const b=document.createElement("button");
    const todayCls=(isFest&&today.getDate()===FDATE[d])?" today":"";
    b.className="day"+(curDay===d?" on":"")+todayCls;
    b.innerHTML=d.replace(" ","<br style='display:none'> ").split(" ")[0].toUpperCase()+" "+d.split(" ")[1];
    b.onclick=()=>{curDay=d;renderDays();renderView();};
    el.appendChild(b);
  });
}
function renderSeg(){
  document.querySelectorAll(".seg button").forEach(b=>{
    b.classList.toggle("on",b.dataset.m===mode);
    b.onclick=()=>{mode=b.dataset.m;renderSeg();renderView();window.scrollTo(0,0);};
  });
}

function progView(){
  const d=curDay, cmap=conflictsForDay(d);
  const favs=DATA.filter(x=>x.j===d&&fav.has(keyOf(x))).sort((a,b)=>toMin(a.d)-toMin(b.d));
  let h="";
  // now / next banner (only meaningful pendant le festival)
  const ni=nowInfo();
  if(ni.live.length){
    const o=ni.live[0];
    h+=`<div class="live"><div class="row"><span class="tag">▶ En ce moment</span></div>
      <div class="band">${esc(o.x.g)}</div><div class="meta">${o.x.s} · jusqu'à ${o.x.f}</div>`;
    if(ni.next){const n=ni.next;h+=`<div class="next"><span class="tag">⏭ Ensuite</span><div class="band" style="font-size:15px">${esc(n.x.g)}</div><div class="meta">${n.x.d} · ${n.x.s}</div></div>`;}
    h+=`</div>`;
  } else if(ni.next && (ni.next.s-ni.now)<6*3600*1000){
    const n=ni.next;h+=`<div class="live"><span class="tag">⏭ Prochain favori</span><div class="band">${esc(n.x.g)}</div><div class="meta">${n.x.d} · ${n.x.s} · ${n.x.s}</div></div>`;
  }
  if(!favs.length){
    h+=`<div class="empty">Aucun groupe coché pour ${DLAB[d].toLowerCase()}.<br>Ajoute tes groupes pour voir ta journée se construire.<br><button onclick="window.__go('all')">Choisir mes groupes</button></div>`;
    return h;
  }
  favs.forEach(x=>{
    const k=keyOf(x), cf=cmap[k];
    h+=`<div class="card${cf?' cflag':''}">
      <div class="time"><div class="s">${x.d}</div><div class="e">${x.f}</div></div>
      <div class="bar" style="background:${SHEX[x.s]}"></div>
      <div class="body">
        <div class="band">${esc(x.g)}</div>
        <div class="stage"><i class="sdot" style="background:${SHEX[x.s]}"></i>${x.s}</div>
        ${cf?`<div class="confl">⚠ En même temps : ${cf.map(b=>esc(b.g)+" ("+b.d+")").join(", ")}</div>`:""}
      </div>
      <button class="rm" onclick="window.__rm('${k.replace(/'/g,"\\'")}')">✕</button>
    </div>`;
  });
  h+=`<div class="foot"><span class="cnt">${favs.length} groupe(s) ce jour</span><button class="pdfbtn" onclick="window.__pdf()">Exporter en PDF</button></div>`;
  return h;
}

function allView(){
  const d=curDay;
  let h=`<input class="search" id="search" type="search" placeholder="Rechercher un groupe…" value="${esc(search)}" autocomplete="off">
    <div class="hint">Touche un groupe pour l'ajouter à ton programme.</div>`;
  const sets=DATA.filter(x=>x.j===d&&(search===""||norm(x.g).includes(norm(search)))).sort((a,b)=>toMin(a.d)-toMin(b.d));
  if(!sets.length){h+=`<div class="empty">Aucun groupe ne correspond.</div>`;return h;}
  sets.forEach(x=>{const k=keyOf(x),sel=fav.has(k);
    h+=`<div class="prow${sel?' sel':''}" onclick="window.__tg('${k.replace(/'/g,"\\'")}')">
      <div class="chk">✓</div>
      <div class="pb"><div class="pn">${esc(x.g)}</div>
      <div class="pm"><i class="sdot" style="background:${SHEX[x.s]}"></i>${x.d}–${x.f} · ${x.s}</div></div>
    </div>`;});
  return h;
}

function renderView(){
  const v=document.getElementById("view");
  v.innerHTML=mode==="prog"?progView():allView();
  if(mode==="all"){const s=document.getElementById("search");if(s){s.oninput=e=>{search=e.target.value;const p=s.selectionStart;renderView();const ns=document.getElementById("search");ns.focus();ns.setSelectionRange(p,p);};}}
}
function render(){renderDays();renderSeg();renderView();}

function buildPrintout(){
  const host=document.getElementById("printout");
  let h=`<div class="p-title">HELLFEST 2026 — Mon planning</div><div class="p-sub">Clisson · 18–21 juin · ${fav.size} groupe(s)</div>`;let any=false;
  DAYS.forEach(d=>{const cmap=conflictsForDay(d);const favs=DATA.filter(x=>x.j===d&&fav.has(keyOf(x))).sort((a,b)=>toMin(a.d)-toMin(b.d));
    if(!favs.length)return;any=true;const np=Object.keys(cmap).length;
    h+=`<div class="p-day">${DLAB[d]}</div>`;if(np)h+=`<div class="p-warn">⚠ chevauchement(s) — lignes marquées ⚠</div>`;
    h+=`<table class="p-table"><thead><tr><th>Heure</th><th>Groupe</th><th>Scène</th><th></th></tr></thead><tbody>`;
    favs.forEach(x=>{const isC=!!cmap[keyOf(x)];h+=`<tr class="${isC?'p-row-c':''}"><td class="p-time">${x.d}–${x.f}</td><td class="p-band">${esc(x.g)}</td><td>${x.s}</td><td class="p-c">${isC?'⚠':''}</td></tr>`;});
    h+=`</tbody></table>`;});
  if(!any)h+=`<div class="p-warn">Aucun groupe sélectionné.</div>`;host.innerHTML=h;
}
window.__tg=k=>toggle(k);
window.__rm=k=>{fav.delete(k);saveFavs();renderView();};
window.__go=m=>{mode=m;renderSeg();renderView();window.scrollTo(0,0);};
window.__pdf=()=>{buildPrintout();window.print();};

(async()=>{
  await loadFavs();
  const t=new Date();if(t.getFullYear()===2026&&t.getMonth()===5){const dd=DAYS.find(d=>FDATE[d]===t.getDate());if(dd)curDay=dd;}
  render();
  setInterval(()=>{if(mode==="prog")renderView();},30000);
})();
</script>
